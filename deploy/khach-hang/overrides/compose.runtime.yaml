services:
  configurator:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
  backend:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test:
        - CMD
        - /home/frappe/frappe-bench/env/bin/python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/method/ping',headers={'Host':'frontend'}); assert urllib.request.urlopen(r,timeout=10).status==200"
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
  frontend:
    environment:
      TZ: Asia/Ho_Chi_Minh
      FRAPPE_SITE_NAME_HEADER: frontend
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18081}:8080"
    volumes:
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test:
        - CMD
        - /home/frappe/frappe-bench/env/bin/python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/api/method/ping',timeout=10).status==200"
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
  websocket:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
  queue-short:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
  queue-long:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
  scheduler:
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - logs:/home/frappe/frappe-bench/logs
  db:
    image: ${MARIADB_IMAGE:?Cần MARIADB_IMAGE}
    environment:
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      start_period: 20s
      retries: 12
  redis-cache:
    image: ${REDIS_IMAGE:?Cần REDIS_IMAGE}
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 5s
      retries: 5
  redis-queue:
    image: ${REDIS_IMAGE:?Cần REDIS_IMAGE}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  logs:
  redis-cache-data:
