# Bật HTTPS tự động (Caddy + Let's Encrypt) khi khách có tên miền. Cần DOMAIN trong .env, tên miền đã trỏ về IP máy, mở cổng 80 và 443.
# Khi dùng: đặt HTTP_BIND=127.0.0.1 để chỉ Caddy mới ra ngoài, và thêm file này vào erpctl (biến ERP_HTTPS=1).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Cần DOMAIN}
    command: ["sh", "-c", "printf '%s {\\n  reverse_proxy frontend:8080\\n}\\n' \"$$DOMAIN\" > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - caddy-data:/data
    depends_on:
      - frontend

volumes:
  caddy-data:
