# APH-VH trên NocoBase 2.2.31 (Postgres 16). Dữ liệu ở ./storage và ./pgdata cạnh tệp này.
name: aphvh-nocobase
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase"]
      interval: 5s
      retries: 20
  app:
    image: nocobase/nocobase:2.2.31
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY}
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      INIT_ROOT_EMAIL: ${ADMIN_EMAIL}
      INIT_ROOT_PASSWORD: ${ADMIN_PASSWORD}
      INIT_ROOT_NICKNAME: Quản trị
      INIT_APP_LANG: vi-VN
    volumes:
      - ./storage:/app/nocobase/storage
    ports:
      - "${PORT:-13000}:80"
