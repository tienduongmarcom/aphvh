[project]
name = "kh_aph"
authors = [
    { name = "An Phú Hưng - Vĩnh Hưng", email = "tienduongmarcom@gmail.com" }
]
description = "App riêng của khách An Phú Hưng - Vĩnh Hưng trên lõi 9xLab"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E101", "E402", "E501", "W191", "RUF001", "RUF002", "RUF003"]
