name: UAT candidate image verification
on:
  push:
    branches: ["fix/p0-uat-v091-20261010"]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aphvh-uat:verification
          build-args: ERPNEXT_IMAGE=frappe/erpnext:v16.36.1
      - name: Record versions and verified source hashes
        run: |
          docker run --rm --entrypoint bash aphvh-uat:verification -ec '
            cd /home/frappe/frappe-bench
            bench version
            sha256sum apps/kh_aph/kh_aph/credit_release.py apps/kh_aph/kh_aph/hooks.py
            test "$(sha256sum apps/kh_aph/kh_aph/credit_release.py | cut -d" " -f1)" = "0e428e762eb6f393a8ae5a9ea5553120bd800961cc593f2d122fccbb72f36e80"
            test "$(sha256sum apps/kh_aph/kh_aph/hooks.py | cut -d" " -f1)" = "dc5dd72b0211c6198e49d88da2e864f1f0fc0b22c57acc387e0becb333e19675"
          ' > candidate-image-evidence.txt
          cat candidate-image-evidence.txt
      - name: Create isolated database and Redis
        run: |
          docker run -d --name uat-db --network host -e MARIADB_ROOT_PASSWORD=uat-fixture-only mariadb:11.8 --port=13306 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          docker run -d --name uat-redis --network host redis:8.6-alpine redis-server --port 16379
          ready=0
          for i in $(seq 1 40); do
            if docker exec uat-db mariadb -uroot -puat-fixture-only -P13306 -h127.0.0.1 -e 'select 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
      - name: Install and verify candidate on fresh UAT site
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint bash aphvh-uat:verification -ec '
            cd /home/frappe/frappe-bench
            bench set-config -g db_host 127.0.0.1
            bench set-config -g db_port 13306
            bench set-config -g redis_cache redis://127.0.0.1:16379
            bench set-config -g redis_queue redis://127.0.0.1:16379
            bench set-config -g redis_socketio redis://127.0.0.1:16379
            bench new-site aphvh-web-uat --db-root-username root --db-root-password uat-fixture-only --admin-password uat-fixture-only --install-app erpnext --install-app lab9x --install-app kh_aph --mariadb-user-host-login-scope="%"
            bench --site aphvh-web-uat disable-scheduler
            bench --site aphvh-web-uat set-config mute_emails 1
            bench --site aphvh-web-uat execute kh_aph.khach_hang.ap_dung --kwargs "{\"duong_dan\": \"/home/frappe/frappe-bench/apps/kh_aph/khach/aph-vh/khach.json\"}"
            for flag in kh_aph_server_cost_guard kh_aph_post_receivable_on_delivery kh_aph_shared_sales_order kh_aph_global_credit_warning kh_aph_high_risk_credit_guard; do
              bench --site aphvh-web-uat set-config "$flag" 1
            done
            bench --site aphvh-web-uat execute kh_aph.uat_candidate_setup.setup_uat
            bench --site aphvh-web-uat execute kh_aph.uat_fresh_verify.verify
          ' 2>&1 | tee fresh-site-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image-evidence
          path: |
            candidate-image-evidence.txt
            fresh-site-evidence.txt
