# Phát hành: đẩy tag dạng v0.6.1 -> chạy test -> Cổng 2 (site trắng theo từng khách) -> dựng image -> đẩy lên GitHub Container Registry (ghcr.io).
# Image dùng phiên bản app làm nhãn; KHÔNG dùng nhãn "latest" khi triển khai cho khách.
name: Phát hành image
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aphvh-erpnext
  ERPNEXT_IMAGE: frappe/erpnext:v16.36.1
jobs:
  cong-2:
    uses: ./.github/workflows/cong-2-site-trang.yml
  phat-hanh:
    needs: cong-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm phiên bản khớp tag
        run: |
          V=$(python3 -c "import re;print(re.search(r'\"(.+)\"',open('aphvh/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${V}" ]; then echo "Tag ${GITHUB_REF_NAME} không khớp phiên bản app ${V}"; exit 1; fi
          echo "VERSION=${V}" >> "$GITHUB_ENV"
      - name: Test đơn vị
        run: |
          (cd apps/lab9x && python3 -m unittest discover -s lab9x/tests -t .)
          PYTHONPATH=apps/lab9x python3 -m unittest discover -s aphvh/tests -t .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dựng và đẩy image (Dockerfile chạy lại test trong image)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ERPNEXT_IMAGE=${{ env.ERPNEXT_IMAGE }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
