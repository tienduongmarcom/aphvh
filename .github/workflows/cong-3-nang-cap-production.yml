# Cổng 3: diễn tập ĐÚNG đường đi của site production `frontend`:
# image production 0.9.1 (đúng digest đang chạy) -> dung.sh -> nang-cap.sh lên bản ứng viên -> bật cờ + bộ cài
# production (kh_aph.cai_dat_tinh_nang) -> so schema với site dựng mới cùng bản -> quay-lui.sh về 0.9.1 -> so dấu vân.
# Toàn bộ chạy trên dữ liệu giả của máy CI; không chạm máy chủ hay dữ liệu thật.
name: Cổng 3 - nâng cấp từ bản production
on:
  workflow_call: {}
  workflow_dispatch: {}
  push:
    branches: ["fix/p0-uat-v091-20261010", "thu/erpnext-v16.50"]
permissions:
  contents: read
  packages: read
env:
  ERPNEXT_IMAGE: frappe/erpnext:v16.50.0
  PROD_IMAGE: ghcr.io/tienduongmarcom/kh-aph-erpnext
  PROD_TAG: "0.9.1"
  # Digest image đang chạy trên erpnext-prod (kiểm kê chỉ đọc 13/10/2026).
  PROD_DIGEST: sha256:ce75590079309b678b2a15cc2e4a8ccc413345f1eff30b07bd161cd435107bb1
  FLAGS: >-
    kh_aph_server_cost_guard kh_aph_post_receivable_on_delivery kh_aph_shared_sales_order
    kh_aph_global_credit_warning kh_aph_high_risk_credit_guard kh_aph_quantity_valuation_mvp
    kh_aph_funds_workflow kh_aph_source_change
jobs:
  dien-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: lỗi trước "| tee" cũng làm dừng bước
    env:
      CUSTOM_IMAGE: ghcr.io/tienduongmarcom/kh-aph-erpnext
      PULL_POLICY: missing
      HTTP_BIND: 127.0.0.1
      HTTP_PORT: "18092"
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng đĩa runner (image ERPNext 16.50 lớn hơn)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Kéo đúng image production 0.9.1 theo digest
        run: |
          docker pull "$PROD_IMAGE@$PROD_DIGEST"
          docker tag "$PROD_IMAGE@$PROD_DIGEST" "$PROD_IMAGE:$PROD_TAG"
          docker run --rm --entrypoint bash "$PROD_IMAGE:$PROD_TAG" -c 'cd /home/frappe/frappe-bench && bench version' | tee "$RUNNER_TEMP/log-0-phien-ban.txt"
          grep -q "kh_aph 0.9.1" "$RUNNER_TEMP/log-0-phien-ban.txt"
      - uses: docker/setup-buildx-action@v3
      - name: Dựng bản ứng viên (không đẩy)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/tienduongmarcom/kh-aph-erpnext:ung-vien
          build-args: ERPNEXT_IMAGE=${{ env.ERPNEXT_IMAGE }}
      - name: Hàm dùng chung
        run: |
          cat > "$RUNNER_TEMP/ham.sh" <<'EOF'
          cd "$RUNNER_TEMP/erp/ci"
          dv() { ./erpctl exec -T -w /home/frappe/frappe-bench/sites backend /home/frappe/frappe-bench/env/bin/python - "$1" < "$GITHUB_WORKSPACE/deploy/release/dau_van_site.py"; }
          so() { python3 "$GITHUB_WORKSPACE/deploy/release/so_dau_van.py" "$@"; }
          ex() { ./erpctl exec -T backend bench --site "$@" </dev/null; }
          EOF
      - name: 1. dung.sh bằng image production 0.9.1 (giống frontend)
        run: |
          export ERP_HOME="$RUNNER_TEMP/erp"
          ./deploy/khach-hang/dung.sh ci "$PROD_TAG" khach/aph-vh/khach.json </dev/null 2>&1 | tee "$RUNNER_TEMP/log-1.txt"
          grep -q "== XONG" "$RUNNER_TEMP/log-1.txt"
          source "$RUNNER_TEMP/ham.sh"
          dv frontend | tee "$RUNNER_TEMP/dv-0-truoc.txt"
          python3 - "$RUNNER_TEMP/dv-0-truoc.txt" <<'EOF'
          import json,sys
          d=json.loads([l for l in open(sys.argv[1]) if l.startswith("DAU_VAN ")][0][8:])
          print(f"::notice title=Dấu vân trước nâng cấp (so với frontend thật)::schema {d['schema']['so_muc']} mục, sha {d['schema']['sha256'][:16]}")
          EOF
          grep -q '"kh_aph": "0.9.1"' "$RUNNER_TEMP/dv-0-truoc.txt"
      - name: 2. nang-cap.sh lên bản ứng viên (cờ còn tắt)
        run: |
          source "$RUNNER_TEMP/ham.sh"
          ./nang-cap.sh ung-vien </dev/null 2>&1 | tee "$RUNNER_TEMP/log-2.txt"
          grep -q "^CUSTOM_TAG=ung-vien$" .env
          grep -q "kiểm đạt" "$RUNNER_TEMP/log-2.txt"
          dv frontend | tee "$RUNNER_TEMP/dv-1-sau-nang-cap.txt"
          # Migrate không được đổi dữ liệu nghiệp vụ hay số dư sổ.
          so "$RUNNER_TEMP/dv-0-truoc.txt" "$RUNNER_TEMP/dv-1-sau-nang-cap.txt" --phan tong,co | tee "$RUNNER_TEMP/log-2b.txt"
      - name: 3. Bộ cài production từ chối khi chưa bật cờ / gõ sai site
        run: |
          source "$RUNNER_TEMP/ham.sh"
          set +e
          ex frontend execute kh_aph.cai_dat_tinh_nang.cai --kwargs '{"xac_nhan_site": "frontend"}' > "$RUNNER_TEMP/log-3a.txt" 2>&1; rc1=$?
          set -e
          cat "$RUNNER_TEMP/log-3a.txt" | tail -5
          test "$rc1" -ne 0
          grep -q "kh_aph_server_cost_guard" "$RUNNER_TEMP/log-3a.txt"
          for f in $FLAGS; do ex frontend set-config -p "$f" 1; done
          set +e
          ex frontend execute kh_aph.cai_dat_tinh_nang.cai --kwargs '{"xac_nhan_site": "site-sai"}' > "$RUNNER_TEMP/log-3b.txt" 2>&1; rc2=$?
          set -e
          tail -5 "$RUNNER_TEMP/log-3b.txt"
          test "$rc2" -ne 0
      - name: 4. Bật cờ + cài + kiểm (chạy lại không đổi)
        run: |
          source "$RUNNER_TEMP/ham.sh"
          ex frontend execute kh_aph.cai_dat_tinh_nang.cai --kwargs '{"xac_nhan_site": "frontend"}' | tee "$RUNNER_TEMP/log-4a.txt"
          grep -q '"idempotent": true' "$RUNNER_TEMP/log-4a.txt"
          ex frontend execute kh_aph.cai_dat_tinh_nang.kiem --kwargs '{"xac_nhan_site": "frontend"}' | tee "$RUNNER_TEMP/log-4b.txt"
          grep -q '"idempotent": true' "$RUNNER_TEMP/log-4b.txt"
          ./erpctl exec -T backend bash -c 'cat > /tmp/khach.json' < khach.json
          ex frontend execute kh_aph.kiem_trien_khai.chay --kwargs '{"duong_dan": "/tmp/khach.json"}' | tee "$RUNNER_TEMP/log-4c.txt"
          grep -q "KHÔNG ĐẠT: 0" "$RUNNER_TEMP/log-4c.txt"
          dv frontend | tee "$RUNNER_TEMP/dv-2-sau-cai.txt"
          so "$RUNNER_TEMP/dv-0-truoc.txt" "$RUNNER_TEMP/dv-2-sau-cai.txt" --phan tong | tee "$RUNNER_TEMP/log-4d.txt"
      - name: 5. So schema với site dựng mới cùng bản (đường UAT)
        run: |
          source "$RUNNER_TEMP/ham.sh"
          set -a; source .env; set +a
          ./erpctl exec -T backend bash -c 'bench new-site doi-chieu --mariadb-user-host-login-scope="172.%.%.%" --db-root-username root --db-root-password "'"$DB_PASSWORD"'" --admin-password ci-doi-chieu --install-app erpnext --install-app lab9x --install-app kh_aph' </dev/null > "$RUNNER_TEMP/log-5a.txt" 2>&1
          ex doi-chieu execute kh_aph.khach_hang.ap_dung --kwargs '{"duong_dan": "/tmp/khach.json"}' > "$RUNNER_TEMP/log-5b.txt" 2>&1
          for f in $FLAGS; do ex doi-chieu set-config -p "$f" 1; done
          ex doi-chieu execute kh_aph.cai_dat_tinh_nang.cai --kwargs '{"xac_nhan_site": "doi-chieu"}' > "$RUNNER_TEMP/log-5c.txt" 2>&1
          grep -q '"idempotent": true' "$RUNNER_TEMP/log-5c.txt"
          dv doi-chieu > "$RUNNER_TEMP/dv-3-doi-chieu.txt"
          # Mẫu in mặc định ERPNext tự đặt cho chứng từ app KHÔNG quản lý: ERPNext 16.50 chỉ đặt "… Modern with Images"
          # khi cài mới, site nâng cấp giữ "… with Item Image" — hành vi của ERPNext, không phải lệch do app.
          # 5 chứng từ app đặt mẫu riêng (install.DEFAULT_PRINT_FORMATS) KHÔNG bỏ qua: phải khớp mẫu của app.
          so "$RUNNER_TEMP/dv-2-sau-cai.txt" "$RUNNER_TEMP/dv-3-doi-chieu.txt" --phan schema,co \
            --bo-qua '^PS\|(?!(Purchase Receipt|Stock Entry|Delivery Note|Payment Entry|Sales Invoice)\|)[^|]+\|\|default_print_format\|.*( with Item Image| Modern with Images)$' | tee "$RUNNER_TEMP/log-5d.txt"
          ./erpctl exec -T backend bash -c 'bench drop-site doi-chieu --force --no-backup --db-root-username root --db-root-password "'"$DB_PASSWORD"'"' </dev/null > "$RUNNER_TEMP/log-5e.txt" 2>&1
      - name: 6. quay-lui.sh về 0.9.1, cờ trả về như bản sao lưu
        run: |
          source "$RUNNER_TEMP/ham.sh"
          BK="$(grep -lx "$PROD_TAG" sao-luu/*/phien-ban-truoc.txt | head -1 | xargs dirname | xargs basename)"
          echo "Bản sao lưu: $BK"
          ./quay-lui.sh "$BK" --tu-dong </dev/null 2>&1 | tee "$RUNNER_TEMP/log-6.txt"
          grep -q "^CUSTOM_TAG=$PROD_TAG$" .env
          if grep -q " 1$" "sao-luu/$BK/co-sau-quay-lui.txt"; then echo "Cờ còn bật sau quay lui"; exit 1; fi
          # quay-lui.sh tạo lại container (đổi image): chép lại khach.json trước khi kiểm.
          ./erpctl exec -T backend bash -c 'cat > /tmp/khach.json' < khach.json
          ex frontend execute kh_aph.kiem_trien_khai.chay --kwargs '{"duong_dan": "/tmp/khach.json"}' | tee "$RUNNER_TEMP/log-6b.txt"
          grep -q "KHÔNG ĐẠT: 0" "$RUNNER_TEMP/log-6b.txt"
          dv frontend | tee "$RUNNER_TEMP/dv-4-sau-quay-lui.txt"
          so "$RUNNER_TEMP/dv-0-truoc.txt" "$RUNNER_TEMP/dv-4-sau-quay-lui.txt" --phan schema,dem,tong,co,versions | tee "$RUNNER_TEMP/log-6c.txt"
      - name: Nhật ký khi lỗi
        if: failure()
        run: |
          # GitHub chỉ giữ 10 chú thích mỗi bước: in log mới nhất trước.
          for f in $(ls -t "$RUNNER_TEMP"/log-*.txt 2>/dev/null | head -8); do
            [ -f "$f" ] || continue
            echo "::error title=$(basename "$f")::$(tail -c 1500 "$f" | tr '\n\r' '  ' | sed 's/%/%25/g')"
          done
          cd "$RUNNER_TEMP/erp/ci" 2>/dev/null && ./erpctl ps -a && ./erpctl logs --tail 80 backend 2>&1 | tail -80 || true
      - name: Gom bằng chứng
        if: always()
        run: |
          mkdir -p bang-chung
          cp "$RUNNER_TEMP"/log-*.txt "$RUNNER_TEMP"/dv-*.txt bang-chung/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cong-3-bang-chung
          path: bang-chung/
