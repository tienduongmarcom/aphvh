# Cổng 2b: diễn tập triển khai thật trên máy Linux amd64 (giống máy chủ khách) bằng đúng các script giao cho khách:
#   dung.sh (dựng khách mới) -> nang-cap.sh (lên bản kế) -> nang-cap.sh bản không tồn tại (phải giữ nguyên bản cũ)
#   -> quay-lui.sh (về bản trước, khôi phục dữ liệu) -> kiểm lại.
# Lỗi ở bước nào thì in phần cuối nhật ký thành chú thích (annotation) để đọc được qua API.
name: Cổng 2b - diễn tập triển khai
on:
  workflow_call: {}
  workflow_dispatch: {}
  push:
    branches: ["feat/ban-hang-nhanh-20261016"]
permissions:
  contents: read
env:
  ERPNEXT_IMAGE: frappe/erpnext@sha256:a856e7f65c7bfc9cfa2e74f95b62e11d37190c380d958cbf3bea5d05e2ec9268  # ERPNext 16.51.1; phiên bản Frappe ghi bởi bench version trong CI
jobs:
  dien-tap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CUSTOM_IMAGE: kh-aph-erpnext
      PULL_POLICY: missing
      HTTP_BIND: 127.0.0.1
      HTTP_PORT: "18090"
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm probe HTTP có hạn chót
        run: python3 -m unittest kh_aph.tests.test_http_ready
      - name: Giải phóng đĩa runner (image ERPNext 16.50 lớn hơn)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - name: Dựng image (bản A) và gắn thêm tên bản B
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kh-aph-erpnext:ci-a
          build-args: ERPNEXT_IMAGE=${{ env.ERPNEXT_IMAGE }}
      - run: docker tag kh-aph-erpnext:ci-a kh-aph-erpnext:ci-b
      - name: 1. dung.sh - dựng khách mới
        run: |
          export ERP_HOME="$RUNNER_TEMP/erp"
          ./deploy/khach-hang/dung.sh ci ci-a khach/aph-vh/khach.json </dev/null 2>&1 | tee "$RUNNER_TEMP/log-1.txt"
          grep -q "== XONG" "$RUNNER_TEMP/log-1.txt"
          curl -fsS "http://127.0.0.1:18090/api/method/ping"
      - name: 2. nang-cap.sh - lên bản B
        working-directory: ${{ runner.temp }}/erp/ci
        run: |
          ./nang-cap.sh ci-b </dev/null 2>&1 | tee "$RUNNER_TEMP/log-2.txt"
          grep -q "^CUSTOM_TAG=ci-b$" .env
          grep -q "kiểm đạt" "$RUNNER_TEMP/log-2.txt"
          # Tách web đang khởi động sau nâng cấp khỏi ca kéo image lỗi ở bước 3.
          # Không chỉ sleep một khoảng cố định và không nhận 200 sai nội dung là đạt.
          python3 "$GITHUB_WORKSPACE/deploy/release/cho_http.py" "http://127.0.0.1:18090/api/method/ping" --timeout 180
      - name: 3. nang-cap.sh - bản không tồn tại phải giữ nguyên bản B
        working-directory: ${{ runner.temp }}/erp/ci
        run: |
          set +e
          ./nang-cap.sh ci-khong-co </dev/null > "$RUNNER_TEMP/log-3.txt" 2>&1; rc=$?
          set -e
          cat "$RUNNER_TEMP/log-3.txt"
          test "$rc" -eq 2
          grep -q "^CUSTOM_TAG=ci-b$" .env
          # Web đã được xác nhận hoạt động ở bước 2: thử kéo image lỗi không được làm gián đoạn nó.
          curl -fsS "http://127.0.0.1:18090/api/method/ping"
      - name: 4. quay-lui.sh - về bản A và khôi phục dữ liệu
        working-directory: ${{ runner.temp }}/erp/ci
        run: |
          BK="$(grep -lx ci-a sao-luu/*/phien-ban-truoc.txt | head -1 | xargs dirname | xargs basename)"
          echo "Bản sao lưu: $BK"
          ./quay-lui.sh "$BK" --tu-dong </dev/null 2>&1 | tee "$RUNNER_TEMP/log-4.txt"
          grep -q "^CUSTOM_TAG=ci-a$" .env
          ./erpctl exec -T backend bash -c 'cat > /tmp/khach.json' < khach.json
          ./erpctl exec -T backend bench --site frontend execute kh_aph.kiem_trien_khai.chay --kwargs '{"duong_dan": "/tmp/khach.json"}' </dev/null | tee "$RUNNER_TEMP/log-4b.txt"
          grep -q "KHÔNG ĐẠT: 0" "$RUNNER_TEMP/log-4b.txt"
      - name: Nhật ký khi lỗi
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/log-*.txt; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename "$f")::$(tail -c 1500 "$f" | tr '\n\r' '  ' | sed 's/%/%25/g')"
          done
          cd "$RUNNER_TEMP/erp/ci" 2>/dev/null && ./erpctl ps -a && ./erpctl logs --tail 80 backend 2>&1 | tail -80 || true
